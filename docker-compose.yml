services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sast_db
      POSTGRES_USER: sast_user
      POSTGRES_PASSWORD: sast_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sast_user -d sast_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://sast_user:sast_password@db:5432/sast_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
